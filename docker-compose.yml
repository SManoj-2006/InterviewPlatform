version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: devintervue_mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  piston:
    image: ghcr.io/engineer-man/piston
    container_name: devintervue_piston
    restart: unless-stopped
    privileged: true
    ports:
      - "2000:2000"
    volumes:
      - piston_data:/piston

  piston-init:
    image: curlimages/curl:8.10.1
    container_name: devintervue_piston_init
    depends_on:
      - piston
    restart: "no"
    entrypoint:
      - sh
      - -c
      - |
        set -e
        until curl -sf http://piston:2000/api/v2/packages >/dev/null; do
          echo "waiting for piston..."
          sleep 2
        done
        echo "installing piston runtimes..."
        curl -sS -X POST http://piston:2000/api/v2/packages -H "Content-Type: application/json" -d '{"language":"node","version":"18.15.0"}' >/dev/null
        curl -sS -X POST http://piston:2000/api/v2/packages -H "Content-Type: application/json" -d '{"language":"python","version":"3.10.0"}' >/dev/null
        curl -sS -X POST http://piston:2000/api/v2/packages -H "Content-Type: application/json" -d '{"language":"java","version":"15.0.2"}' >/dev/null
        echo "piston runtimes installed"

  backend:
    image: node:20-alpine
    container_name: devintervue_backend
    working_dir: /workspace/backend
    depends_on:
      - mongo
      - piston
      - piston-init
    env_file:
      - ./backend/.env
    environment:
      PORT: 3000
      NODE_ENV: development
      DB_URL: mongodb://mongo:27017/devintervue
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      # Defaults to the compose-network Piston service. Override with
      # PISTON_API_URL=http://host.docker.internal:2000/api/v2 to use a
      # Piston container already running on the host instead.
      PISTON_API_URL: ${PISTON_API_URL:-http://piston:2000/api/v2}
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - backend_node_modules:/workspace/backend/node_modules
    command: sh -c "if [ ! -x node_modules/.bin/nodemon ]; then npm install --no-audit --no-fund; fi; npm run dev"

  frontend:
    image: node:20-alpine
    container_name: devintervue_frontend
    working_dir: /workspace/frontend
    depends_on:
      - backend
    env_file:
      - ./frontend/.env
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
      - frontend_node_modules:/workspace/frontend/node_modules
    command: sh -c "if [ ! -x node_modules/.bin/vite ]; then npm install --no-audit --no-fund; fi; npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  mongo_data:
  piston_data:
  backend_node_modules:
  frontend_node_modules:
